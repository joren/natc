{%- assign home = "/labeur/" -%}
{%- if page.lang == "nl" %}{% assign home = "/labeur/nl/" %}{% endif -%}
<header class="py-6 border-b" style="border-color: var(--color-border); background-color: var(--color-surface);">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
    <a href="{{ home }}" class="text-xl font-bold gradient-text">Labeur</a>
    <nav class="flex items-center gap-6 text-sm" style="color: var(--color-text-secondary);">
      <a href="{{ home }}" class="hover:text-blue-500 transition-colors">App</a>
      <a href="{{ home }}#faq" class="hover:text-blue-500 transition-colors hidden sm:inline">FAQ</a>
      <a href="{{ site.labeur.app_store_url }}" target="_blank" rel="noopener noreferrer" class="font-semibold" style="color: var(--color-primary);">Download</a>
    </nav>
  </div>
</header>

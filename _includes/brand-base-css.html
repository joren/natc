<style>
  :root {
    --ink: #273339;
    --ink-soft: #3A4950;
    --honey: #F6A227;
    --honey-light: #FCCC81;
    --honey-deep: #E38B12;
    --cream: #FFF7EC;
    --cream-deep: #FDF0D9;
    --paper: #FFFFFF;
    --muted: #6E7A80;
    --border: #EADFC9;
    --gradient-honey: linear-gradient(135deg, #FCCC81 0%, #F6A227 100%);
    --gradient-honey-soft: linear-gradient(135deg, #FFF0D1 0%, #FCCC81 100%);
    --gradient-sunset: linear-gradient(135deg, #FCCC81 0%, #F6A227 55%, #E07A2F 100%);
    --shadow-soft: 0 10px 30px -12px rgba(39, 51, 57, 0.18);
    --shadow-lift: 0 20px 50px -18px rgba(39, 51, 57, 0.25);
  }
  .dark {
    --ink: #FFF7EC;
    --ink-soft: #E8DFCE;
    --cream: #1B2429;
    --cream-deep: #222D33;
    --paper: #273339;
    --muted: #A8B3B8;
    --border: #3A4950;
    --shadow-soft: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
    --shadow-lift: 0 20px 50px -18px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }

  html, body {
    background-color: var(--cream);
    color: var(--ink);
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow-x: hidden;
    font-feature-settings: "ss01", "cv11";
  }

  .font-display {
    font-family: 'Fraunces', serif;
    font-variation-settings: "SOFT" 100, "opsz" 144;
    letter-spacing: -0.02em;
  }

  .text-honey-gradient {
    background: var(--gradient-sunset);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .underline-wobble {
    position: relative;
    display: inline-block;
  }
  .underline-wobble::after {
    content: '';
    position: absolute;
    left: -2%;
    right: -2%;
    bottom: -4px;
    height: 14px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 14' preserveAspectRatio='none'><path d='M2 9 C 40 2, 80 13, 120 5 S 180 2, 198 8' stroke='%23F6A227' stroke-width='4' stroke-linecap='round' fill='none'/></svg>");
    background-repeat: no-repeat;
    background-size: 100% 100%;
    pointer-events: none;
  }

  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .reveal.active {
    opacity: 1;
    transform: translateY(0);
  }
  .reveal-delay-1 { transition-delay: 0.08s; }
  .reveal-delay-2 { transition-delay: 0.16s; }
  .reveal-delay-3 { transition-delay: 0.24s; }
  .reveal-delay-4 { transition-delay: 0.32s; }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }
  .dark .blob {
    opacity: 0.25;
  }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -40px) scale(1.06); }
    66% { transform: translate(-25px, 20px) scale(0.96); }
  }
  @keyframes drift-rev {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-30px, 30px) scale(1.04); }
    66% { transform: translate(25px, -25px) scale(0.94); }
  }
  .drift { animation: drift 20s ease-in-out infinite; }
  .drift-rev { animation: drift-rev 24s ease-in-out infinite; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    border-radius: 9999px;
    padding: 14px 28px;
    font-weight: 700;
    font-size: 0.95rem;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, background 0.25s ease;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--gradient-sunset);
    color: var(--ink);
    box-shadow: 0 8px 20px -6px rgba(246, 162, 39, 0.55);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px -8px rgba(246, 162, 39, 0.6);
  }
  .btn-ink {
    background: var(--ink);
    color: var(--cream);
    box-shadow: 0 8px 20px -6px rgba(39, 51, 57, 0.4);
  }
  .dark .btn-ink {
    background: var(--cream);
    color: var(--ink);
    box-shadow: 0 8px 20px -6px rgba(255, 247, 236, 0.2);
  }
  .btn-ink:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px -8px rgba(39, 51, 57, 0.5);
  }
  .btn-outline {
    border: 2px solid var(--ink);
    color: var(--ink);
    padding: 12px 26px;
    background: transparent;
  }
  .dark .btn-outline {
    border-color: var(--ink);
    color: var(--ink);
  }
  .btn-outline:hover {
    background: var(--ink);
    color: var(--cream);
    transform: translateY(-2px);
  }
  .dark .btn-outline:hover {
    background: var(--ink);
    color: var(--cream);
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--cream-deep);
    border: 1.5px solid var(--border);
    border-radius: 9999px;
    padding: 6px 16px;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .dark .pill {
    background: var(--paper);
  }
  .pill-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gradient-sunset);
    box-shadow: 0 0 10px rgba(246, 162, 39, 0.6);
  }

  .card {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 28px;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease, border-color 0.35s ease;
    box-shadow: var(--shadow-soft);
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lift);
    border-color: var(--honey);
  }
  .card-muted {
    background: var(--cream-deep);
  }

  .eyebrow {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--honey-deep);
  }
  .dark .eyebrow { color: var(--honey-light); }

  .nav-blur {
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    background: rgba(255, 247, 236, 0.8);
    border-bottom: 1px solid var(--border);
  }
  .dark .nav-blur {
    background: rgba(27, 36, 41, 0.8);
  }

  .mobile-menu {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mobile-menu.open { max-height: 500px; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 4px 12px;
    border-radius: 9999px;
  }
  .chip-live { background: #10B981; color: white; }
  .chip-beta { background: var(--gradient-sunset); color: var(--ink); }
  .chip-soon {
    background: transparent;
    color: var(--muted);
    border: 1.5px dashed var(--border);
  }

  .logo-light { display: block; }
  .logo-dark { display: none; }
  .dark .logo-light { display: none; }
  .dark .logo-dark { display: block; }

  .hero-word {
    display: inline-block;
    opacity: 0;
  }

  .noise::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.15 0 0 0 0 0.2 0 0 0 0 0.22 0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.5;
    mix-blend-mode: multiply;
    z-index: 1;
  }
  .dark .noise::before {
    mix-blend-mode: overlay;
    opacity: 0.3;
  }

  .sticker {
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .sticker:hover {
    transform: rotate(-4deg) scale(1.05);
  }

  *:focus-visible {
    outline: 3px solid var(--honey);
    outline-offset: 3px;
    border-radius: 6px;
  }

  section[id] { scroll-margin-top: 90px; }

  .marquee {
    display: flex;
    overflow: hidden;
    mask-image: linear-gradient(90deg, transparent, black 8%, black 92%, transparent);
    -webkit-mask-image: linear-gradient(90deg, transparent, black 8%, black 92%, transparent);
  }
  .marquee-track {
    display: flex;
    gap: 3rem;
    animation: scroll 40s linear infinite;
    flex-shrink: 0;
    padding-right: 3rem;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
</style>

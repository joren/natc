for_belgians:
  eyebrow_html: "Gemaakt voor België 🇧🇪"
  title_html: "Gebouwd voor hoe <span class=\"gradient-text\">Belgische freelancers écht werken.</span>"
  subtitle: "Of je nu zelfstandige in hoofdberoep bent, een managementvennootschap runt, of iets daartussenin — Labeur houdt bij wat belangrijk is voor jou en je boekhouder."
  cards:
    - tag: "Fietsvergoeding"
      title: "Elke kilometer telt"
      body: "De Belgische belastingvrije fietsvergoeding wordt per gefietste kilometer berekend. Labeur logt elke fietsdag met afstand, zodat je sluitende registratie hebt wanneer je managementvennootschap of boekhouder erom vraagt."
      # NL has a companion guide page; EN does not (keys still mirror for parity).
      guide_link_text: "Lees onze gids over fietsvergoeding bijhouden"
      guide_link_href: "/labeur/fietsvergoeding-belgie/"
    - tag: "Thuiswerk-admin"
      title: "Thuis vs kantoor, altijd duidelijk"
      body: "Thuiswerkkosten verantwoorden of kantoor­aanwezigheid aan een klant aantonen? Tag elke werkdag als Thuis of Kantoor en moet nooit meer gokken op het einde van het kwartaal."
      guide_link_text: ""
      guide_link_href: ""
    - tag: "Klaar voor je boekhouder"
      title: "Een nette maandrapportage"
      body: "Elke maand: totaal gewerkte dagen, verdeling thuis/kantoor, opsplitsing woon-werk, totale fietskilometers. Eén scherm. Doorsturen naar je boekhouder en verder met je dag."
      guide_link_text: ""
      guide_link_href: ""
  stats:
    - number: "2 taps"
      label: "om een volledige werkdag te loggen"
    - number: "100%"
      label: "op je iPhone, nooit in de cloud"
    - number: "€21,99"
      label: "levenslang — geen abonnement nodig"

how_it_works:
  eyebrow: "Zo werkt het"
  title: "Twee tikken. Dag gelogd."
  subtitle: "Van een dagelijkse herinnering tot een nette maandrapportage — geen frictie, niets vergeten."
  phone_aria: "Labeur demo"
  steps:
    - title: "Krijg een dagelijkse herinnering"
      text: "Een melding aan het einde van je werkdag, zodat je nooit vergeet te loggen."
    - title: "Log in seconden"
      text: "Heb je gewerkt? Waar? Hoe ben je gependeld? Drie tikken en je dag staat erin."
    - title: "Bezorg je boekhouder een nette rapportage"
      text: "Maandtotalen, verdeling thuis vs kantoor en fietskilometers — klaar om door te sturen."

features:
  eyebrow: "Functies"
  title_html: "Alles wat je nodig hebt. <span class=\"gradient-text\">Niets wat je niet nodig hebt.</span>"
  subtitle: "Labeur doet één ding goed: Belgische freelancers helpen hun werkdagen bij te houden zonder in de weg te zitten."
  cards:
    - title: "Loggen in twee taps"
      body: "Open de app, tik \"heb je gewerkt?\", kies waar. Klaar in minder dan vijf seconden — zelfs tussen twee klantengesprekken door."
    - title: "Halve dagen"
      body: "'s Morgens gewerkt en 's namiddags verlof genomen? Markeer als halve dag, zodat je facturatie en rapporten kloppen."
    - title: "Fietsvergoeding bijhouden"
      body: "Totaal fietskilometers per maand, klaar voor je fietsvergoeding-papierwerk — RSZ, je managementvennootschap of je eigen zak."
    - title: "Maandrapporten"
      body: "Gewerkte dagen, verdeling thuis/kantoor, opsplitsing woon-werk, fiets-km — alles op één scherm. Kies een maand en exporteer als CSV voor je boekhouder, of stuur een screenshot."

privacy_callout:
  title_html: "Jouw data is <span class=\"gradient-text\">alleen van jou.</span>"
  body: "Labeur is gebouwd vanuit een eenvoudige filosofie: jouw werkdata is niemands zaak behalve die van jezelf. We verzamelen absoluut niets. Geen analytics, geen crashrapporten, geen gebruiksdata, geen persoonsgegevens. Alles blijft op je toestel en verlaat het nooit."
  stats:
    - number: "0"
      label: "Verzamelde data"
    - number: "0"
      label: "Externe SDK's"
    - number: "0"
      label: "Netwerkverzoeken"
  cta_text: "Lees ons privacybeleid"
  cta_href: "/labeur/nl/privacy.html"

faq:
  eyebrow: "FAQ"
  title_html: "Veelgestelde <span class=\"gradient-text\">vragen.</span>"
  subtitle: "Alles wat je wil weten voor je Labeur downloadt."
  items:
    - q: "Kan ik Labeur gebruiken om mijn fietsvergoeding bij te houden?"
      a_html: |
        <p>Ja. Met Labeur duid je een werkdag aan als fietsdag en voeg je het aantal gefietste kilometers toe. Op het einde van de maand krijg je een net overzicht van je fietsdagen en kilometers — precies wat je nodig hebt voor je fietsvergoeding, of die nu via je managementvennootschap, je boekhouder of je eigen administratie loopt.</p>
      schema_answer: "Ja. Met Labeur duid je een werkdag aan als fietsdag en voeg je het aantal gefietste kilometers toe. Op het einde van de maand krijg je een net overzicht van je fietsdagen en kilometers — precies wat je nodig hebt voor je fietsvergoeding, of die nu via je managementvennootschap, je boekhouder of je eigen administratie loopt."
    - q: "Is Labeur voor werknemers of zelfstandigen?"
      a_html: |
        <p>Labeur is gemaakt voor Belgische zelfstandigen, freelancers en eigenaars van een managementvennootschap. De structuur (werkdagen, halve dagen, thuis vs kantoor, woon-werkverkeer, maandrapporten) is opgebouwd rond hoe Belgische zelfstandige administratie écht werkt — niet rond werknemers-timesheets.</p>
        <p>Werknemers die zelf een persoonlijk overzicht willen bijhouden van thuis-/kantoordagen en fietskilometers kunnen Labeur uiteraard ook gebruiken.</p>
      schema_answer: "Labeur is gemaakt voor Belgische zelfstandigen, freelancers en eigenaars van een managementvennootschap. De structuur is opgebouwd rond hoe Belgische zelfstandige administratie werkt. Werknemers die zelf een persoonlijk overzicht willen bijhouden van thuis-/kantoordagen en fietskilometers kunnen Labeur ook gebruiken."
    - q: "Slaat Labeur mijn gegevens op in de cloud?"
      a_html: |
        <p>Nee. Alles blijft op je iPhone. Geen accounts, geen cloud, geen analytics, geen externe SDK's en geen netwerkverkeer. Verwijder je de app, dan zijn je gegevens weg.</p>
      schema_answer: "Nee. Alles blijft op je iPhone. Geen accounts, geen cloud, geen analytics, geen externe SDK's en geen netwerkverkeer. Verwijder je de app, dan zijn je gegevens weg."
    - q: "Kan ik mijn maandrapport doorsturen naar mijn boekhouder?"
      a_html: |
        <p>Ja. Het rapportenscherm toont gewerkte dagen, halve dagen, thuis- vs kantoordagen, type woon-werkverkeer en totale fietskilometers voor elke maand die je kiest. Je kan de maand exporteren als CSV-bestand en rechtstreeks doorsturen naar je boekhouder, een screenshot maken, of de cijfers overnemen in je eigen maandoverzicht — wat het beste in je workflow past.</p>
      schema_answer: "Ja. Het rapportenscherm toont gewerkte dagen, halve dagen, thuis- vs kantoordagen, type woon-werkverkeer en totale fietskilometers voor elke maand die je kiest. Je kan de maand exporteren als CSV-bestand en rechtstreeks doorsturen naar je boekhouder, een screenshot maken, of de cijfers overnemen in je eigen maandoverzicht."
    - q: "Werkt Labeur zonder internet of account?"
      a_html: |
        <p>Ja. Labeur werkt volledig offline. Je hoeft geen account aan te maken, niet in te loggen en geen verbinding te hebben om een dag te loggen of een rapport te bekijken.</p>
      schema_answer: "Ja. Labeur werkt volledig offline. Je hoeft geen account aan te maken, niet in te loggen en geen verbinding te hebben om een dag te loggen of een rapport te bekijken."
    - q: "Wat kost Labeur?"
      a_html: |
        <p>Twee opties in de App Store: <strong>€0,99/maand</strong> als abonnement, of <strong>€21,99</strong> als eenmalige aankoop die voor altijd van jou is. Kies wat past — de eenmalige prijs verdient zichzelf terug op minder dan twee jaar tegenover het abonnement.</p>
      schema_answer: "Twee opties in de App Store: €0,99/maand als abonnement, of €21,99 als eenmalige aankoop die voor altijd van jou is. De eenmalige prijs verdient zichzelf terug op minder dan twee jaar tegenover het abonnement."
    - q: "Welke toestellen ondersteunt Labeur?"
      a_html: |
        <p>Labeur is een iPhone-app en vereist iOS 17 of nieuwer. Er is vandaag geen Android-, web- of Mac-versie.</p>
      schema_answer: "Labeur is een iPhone-app en vereist iOS 17 of nieuwer. Er is vandaag geen Android-, web- of Mac-versie."


for_belgians:
  eyebrow_html: "Made for Belgium 🇧🇪"
  title_html: "Built for the way <span class=\"gradient-text\">Belgian freelancers actually work.</span>"
  subtitle: "Whether you're a full-time freelancer, running a management company, or somewhere in between — Labeur tracks the things that matter to you and your accountant."
  cards:
    - tag: "Fietsvergoeding"
      title: "Every kilometer counts"
      body: "Belgium's tax-free bike allowance pays per kilometer commuted. Labeur logs every bike day with distance, so you have airtight records when your management company or accountant needs them."
      # No companion guide page in EN yet — keep keys present so structure matches NL.
      guide_link_text: ""
      guide_link_href: ""
    - tag: "Thuiswerk admin"
      title: "Home vs office, always clear"
      body: "Justifying home-office expenses or proving office presence to a client? Tag every workday as Home or Office and never guess at the end of the quarter again."
      guide_link_text: ""
      guide_link_href: ""
    - tag: "Boekhouder-ready"
      title: "A clean monthly report"
      body: "Every month: total days worked, home/office split, commute breakdown, total cycling kilometers. One screen. Forward it to your accountant and move on with your day."
      guide_link_text: ""
      guide_link_href: ""
  stats:
    - number: "2 taps"
      label: "to log a full workday"
    - number: "100%"
      label: "on your iPhone, never in the cloud"
    - number: "€2,99"
      label: "no subscriptions, ever"

how_it_works:
  eyebrow: "How it works"
  title: "Two taps. Day logged."
  subtitle: "From a daily reminder to a clean monthly report — no friction, no forgetting."
  phone_aria: "Labeur demo"
  steps:

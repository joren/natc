      text: "A push notification at the end of the workday so you never forget to log."
    - title: "Log in seconds"
      text: "Did you work? Where? How did you commute? Three taps and the day is in."
    - title: "Hand a clean report to your accountant"
      text: "Monthly totals, home vs office split, and bike kilometers — ready to share."

features:
  eyebrow: "Features"
  title_html: "Everything you need. <span class=\"gradient-text\">Nothing you don't.</span>"
  subtitle: "Labeur does one thing well: it helps Belgian freelancers keep track of their workdays without getting in the way."
  cards:
    - title: "Two-tap logging"
      body: "Open the app, tap \"did you work?\", pick where. Done in under five seconds — even between client calls."
    - title: "Half-day support"
      body: "Worked the morning, took a half-day leave? Flag it as a half day so your invoicing and reports add up correctly."
    - title: "Fietsvergoeding tracking"
      body: "Total bike kilometers per month, ready for your bike allowance paperwork — RSZ, your management company, or your own pocket."
    - title: "Monthly reports"
      body: "Days worked, home/office split, commute breakdown, cycling km — all on one screen. Pick any month, screenshot it for your accountant."

privacy_callout:

faq:
  eyebrow: "FAQ"
  title_html: "Frequently asked <span class=\"gradient-text\">questions.</span>"
  subtitle: "Everything you might want to know before downloading Labeur."
  items:
    - q: "Can I use Labeur to track my fietsvergoeding (bike allowance)?"
      a_html: |
        <p>Yes. Labeur lets you mark a workday as a bike commute and add the kilometers you cycled. At the end of the month you get a clean total of bike days and kilometers — exactly what you need for your bike allowance paperwork, whether that goes through your management company, your accountant or your own bookkeeping.</p>
      schema_answer: "Yes. Labeur lets you mark a workday as a bike commute and add the kilometers you cycled. At the end of the month you get a clean total of bike days and kilometers — exactly what you need for your bike allowance paperwork, whether that goes through your management company, your accountant or your own bookkeeping."
    - q: "Is Labeur for employees or freelancers?"
      a_html: |
        <p>Labeur is built for Belgian freelancers, zelfstandigen and management company owners. The structure (workdays, half days, home vs office, commute method, monthly reports) is designed around how Belgian self-employed admin actually works — not around employee timesheets.</p>
        <p>That said, employees who want to keep a personal log of home/office days and bike kilometers can absolutely use it too.</p>
      schema_answer: "Labeur is built for Belgian freelancers, zelfstandigen and management company owners. The structure (workdays, half days, home vs office, commute method, monthly reports) is designed around how Belgian self-employed admin actually works. Employees who want to keep a personal log of home/office days and bike kilometers can use it too."
    - q: "Does Labeur store my data in the cloud?"
      a_html: |
        <p>No. Everything stays on your iPhone. There are no accounts, no cloud sync, no analytics, no third-party SDKs and no network requests. If you delete the app, the data is gone.</p>
      schema_answer: "No. Everything stays on your iPhone. There are no accounts, no cloud sync, no analytics, no third-party SDKs and no network requests. If you delete the app, the data is gone."
    - q: "Can I send my monthly report to my accountant?"
      a_html: |
        <p>Yes. The reports screen shows days worked, half days, home vs office split, commute breakdown and total cycling kilometers for any month you pick. Most users screenshot the month and send it to their boekhouder, or copy the numbers into their own monthly overview.</p>
      schema_answer: "Yes. The reports screen shows days worked, half days, home vs office split, commute breakdown and total cycling kilometers for any month you pick. Most users screenshot the month and send it to their boekhouder, or copy the numbers into their own monthly overview."
    - q: "Does Labeur work without internet or an account?"
      a_html: |
        <p>Yes. Labeur works fully offline. You don't create an account, you don't log in, and you don't need a connection to log a day or view a report.</p>
      schema_answer: "Yes. Labeur works fully offline. You don't create an account, you don't log in, and you don't need a connection to log a day or view a report."
    - q: "What does Labeur cost?"
      a_html: |
        <p>€2.99 — a one-time purchase on the App Store. No subscription, no in-app purchases, no upsell.</p>
      schema_answer: "€2.99 — a one-time purchase on the App Store. No subscription, no in-app purchases, no upsell."
    - q: "Which devices does Labeur support?"
      a_html: |
        <p>Labeur is an iPhone app and requires iOS 17 or later. There is no Android, web or Mac version today.</p>
      schema_answer: "Labeur is an iPhone app and requires iOS 17 or later. There is no Android, web or Mac version today."

